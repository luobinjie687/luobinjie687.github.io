<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>罗彬杰 · 个人主页</title>
<meta name="description" content="罗彬杰（Binjie Luo），重庆医科大学临床医学专业本科生。这里有我的学习方向、教育背景、课程技能与联系方式，并会持续更新。">
<meta name="author" content="罗彬杰">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1114" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="profile">
<meta property="og:title" content="罗彬杰 · 个人主页">
<meta property="og:description" content="重庆医科大学临床医学专业本科生。学习方向、教育背景、课程技能与联系方式。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
<link rel="stylesheet" href="assets/style.css">
<script>
  /* 尽早应用主题，避免刷新时闪白 */
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
</head>
<body>

<div class="progress" id="progress" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#top" id="brand">个人主页</a>
    <nav class="nav-links" id="nav" aria-label="页面导航"></nav>
    <button class="theme-btn" id="theme-btn" title="切换深/浅色" aria-label="切换主题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
      </svg>
    </button>
  </div>
</header>

<main id="top">
  <div class="wrap">

    <!-- ================= 首屏 ================= -->
    <section class="hero" id="about">
      <div class="hero-glow" aria-hidden="true"></div>
      <div class="hero-text">
        <h1 id="name"></h1>
        <div class="name-en" id="name-en"></div>
        <div class="role" id="title"></div>
        <div class="affil" id="affil"></div>
        <p class="bio" id="bio"></p>
        <div class="facts" id="facts"></div>
        <div class="link-row" id="links"></div>
      </div>
      <div class="avatar-wrap">
        <div class="avatar" id="avatar"></div>
      </div>
    </section>

    <!-- ================= 学习方向 ================= -->
    <section id="research">
      <div class="sec-head">
        <h2 class="sec-title"><span class="sec-index">01</span>学习方向</h2>
        <p class="sec-sub">What I'm Curious About</p>
      </div>
      <div class="research-grid" id="research-grid"></div>
    </section>

    <!-- ================= 教育背景 ================= -->
    <section id="education">
      <div class="sec-head">
        <h2 class="sec-title"><span class="sec-index">02</span>教育背景</h2>
        <p class="sec-sub">Education</p>
      </div>
      <div id="edu-list"></div>
    </section>

    <!-- ================= 课程与技能 ================= -->
    <section id="skills">
      <div class="sec-head">
        <h2 class="sec-title"><span class="sec-index">03</span>课程与技能</h2>
        <p class="sec-sub">Coursework &amp; Skills</p>
      </div>
      <div id="skill-list"></div>
    </section>

    <!-- ================= 学习路线 ================= -->
    <section id="plan">
      <div class="sec-head">
        <h2 class="sec-title"><span class="sec-index">04</span>学习路线</h2>
        <p class="sec-sub">Roadmap</p>
      </div>
      <div class="plan" id="plan-list"></div>
    </section>

    <!-- ================= 论文（有内容才显示） ================= -->
    <section id="publications" hidden>
      <div class="sec-head">
        <h2 class="sec-title"><span class="sec-index">05</span>论文</h2>
        <p class="sec-sub">Publications · ★ 代表作</p>
      </div>
      <div id="pub-list"></div>
    </section>

    <!-- ================= 科研项目（有内容才显示） ================= -->
    <section id="projects" hidden>
      <div class="sec-head">
        <h2 class="sec-title"><span class="sec-index">06</span>科研项目</h2>
        <p class="sec-sub">Projects &amp; Grants</p>
      </div>
      <div id="proj-list"></div>
    </section>

    <!-- ================= 近况 ================= -->
    <section id="news">
      <div class="sec-head">
        <h2 class="sec-title"><span class="sec-index">07</span>近况</h2>
        <p class="sec-sub">News</p>
      </div>
      <ul class="timeline" id="news-list"></ul>
    </section>

    <!-- ================= 联系方式 ================= -->
    <section id="contact">
      <div class="sec-head">
        <h2 class="sec-title"><span class="sec-index">08</span>联系方式</h2>
        <p class="sec-sub">Contact</p>
      </div>
      <div class="contact-card" id="contact-card"></div>
    </section>

  </div>
</main>

<footer>
  <div class="wrap">
    <div class="foot-line">© <span id="year"></span> <span id="foot-name"></span></div>
    <div class="foot-note">手写的静态页面，内容在 <a href="data/site.js">data/site.js</a>，Git 里留着每一次改动。</div>
  </div>
</footer>

<div class="toast" id="toast">邮箱已复制</div>

<script src="data/site.js"></script>
<script src="assets/main.js"></script>
</body>
</html>
